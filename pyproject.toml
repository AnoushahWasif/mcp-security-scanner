[project]
name = "mcp-security-scanner"
version = "0.1.0"
description = "Find poisoned tools, rug pulls and risky configs in MCP servers, with a benchmark that measures it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The guard model layer (day 5). The base scanner needs nothing outside the standard library.
guard = ["scikit-learn>=1.9.1", "numpy>=2.0", "safetensors>=0.4"]

[project.scripts]
mcpscan = "mcpscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded server source as test input: its long lines are the input, not our style.
"tests/test_extract.py" = ["E501"]
"bench/make_handwritten.py" = ["E501"]
"tests/test_rules.py" = ["E501"]
"tests/test_guard.py" = ["E501"]
"tests/test_cli.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
